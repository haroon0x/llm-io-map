<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLM I/O Map</title>
<style>
  :root{
    --bg:#090b0e; --panel:#0f1319; --panel-2:#141a22; --panel-3:#19202a;
    --line:#222b36; --line-soft:#1a222c;
    --text:#e7ecf2; --text-dim:#aab4c2; --muted:#76818f; --faint:#525d6b;
    --accent:#5eead4; --accent-dim:rgba(94,234,212,.12); --accent-line:rgba(94,234,212,.35);
    --blue:#7dd3fc;
    --g-recorded:#34d399; --g-serialized:#60a5fa; --g-reconstructed:#c084fc;
    --g-representative:#fbbf24; --g-unresolved:#f87171;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--sans);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:rgba(94,234,212,.22)}
  a{color:var(--accent);text-decoration:none}
  code,pre,.mono{font-family:var(--mono);font-size:12.5px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:inherit}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- shell ---------- */
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header.top{display:flex;align-items:center;gap:18px;padding:12px 18px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d1117,#0a0d11);flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-mark{width:26px;height:26px;border-radius:7px;flex:none;
    background:conic-gradient(from 210deg,#5eead4,#60a5fa,#c084fc,#5eead4);position:relative}
  .brand-mark::after{content:"";position:absolute;inset:3px;border-radius:5px;background:#0b0f14}
  .brand-name{font-weight:650;letter-spacing:.2px;white-space:nowrap}
  .brand-sub{color:var(--muted);font-size:12px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel);color:var(--text-dim);font-size:12px;white-space:nowrap}
  .pill b{color:var(--text);font-weight:600}
  .pill .dot{width:7px;height:7px;border-radius:50%}

  .shell{display:flex;flex:1;min-height:0}
  aside{width:308px;flex:none;border-right:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;min-height:0}
  .search-wrap{padding:12px 12px 8px}
  .search{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);outline:none}
  .search:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-dim)}
  .legend{display:flex;flex-wrap:wrap;gap:5px 10px;padding:0 12px 10px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
  nav.list{flex:1;overflow:auto;padding:4px 8px 20px}
  .group-label{display:flex;align-items:center;gap:8px;padding:12px 6px 5px;color:var(--faint);
    font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:650}
  .group-label .count{color:var(--faint);font-family:var(--mono);letter-spacing:0}
  .site-btn{display:block;width:100%;text-align:left;padding:8px 9px;border-radius:8px;border:1px solid transparent;margin-bottom:2px}
  .site-btn:hover{background:var(--panel-2)}
  .site-btn[aria-current="true"]{background:var(--panel-3);border-color:var(--line)}
  .site-btn .row1{display:flex;align-items:center;gap:6px}
  .site-btn .nm{font-weight:560;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .site-btn .meta{display:flex;gap:6px;align-items:center;margin-top:3px;color:var(--muted);font-size:11px;
    font-family:var(--mono);overflow:hidden;white-space:nowrap}
  .site-btn .meta .sep{color:var(--faint)}
  .site-btn .loc{color:var(--faint);font-size:10.5px;font-family:var(--mono);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .overview-btn{font-weight:600;font-size:13px;padding:9px 9px;color:var(--text)}
  .overview-btn[aria-current="true"]{background:var(--panel-3);border-color:var(--line)}
  .empty-list{color:var(--muted);font-size:12.5px;padding:18px 10px}

  main{flex:1;min-width:0;overflow:auto;background:
    radial-gradient(1200px 500px at 80% -20%,rgba(96,165,250,.05),transparent 60%),var(--bg)}
  .page{max-width:1080px;padding:22px 26px 60px}
  .crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-bottom:8px;flex-wrap:wrap}
  .crumb .id{font-family:var(--mono);color:var(--faint)}
  h1{font-size:22px;line-height:1.25;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
  .subtitle{color:var(--text-dim);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .subtitle .sep{color:var(--faint)}
  .site-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  .site-head .grades{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;padding-top:4px}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 20px;flex-wrap:wrap}
  .tab{padding:8px 13px;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;font-weight:520;margin-bottom:-1px}
  .tab:hover{color:var(--text-dim)}
  .tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
  .tab .kbd{color:var(--faint);font-size:10px;font-family:var(--mono);margin-left:5px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
  .card-h .t{font-weight:600;font-size:12.5px;letter-spacing:.01em}
  .card-h .hint{color:var(--muted);font-size:11.5px;margin-left:auto;font-family:var(--mono)}
  .card-b{padding:14px}
  .card-b.tight{padding:0}
  .kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:0;font-size:13px}
  .kv > div{padding:7px 12px;border-bottom:1px solid var(--line-soft)}
  .kv > div:nth-child(odd){color:var(--muted);font-size:12px}
  .kv > div:last-child,.kv > div:nth-last-child(2){border-bottom:0}
  .kv .mono{color:var(--text-dim)}
  .empty-note{color:var(--muted);font-size:12.5px;padding:4px 0}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
    font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap;font-family:var(--mono)}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .g-recorded{color:var(--g-recorded);background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3)}
  .g-serialized{color:var(--g-serialized);background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.3)}
  .g-reconstructed{color:var(--g-reconstructed);background:rgba(192,132,252,.1);border-color:rgba(192,132,252,.3)}
  .g-representative{color:var(--g-representative);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3)}
  .g-unresolved{color:var(--g-unresolved);background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:11px;color:var(--text-dim);background:var(--panel-3);
    border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  .filelink{font-family:var(--mono);font-size:12px;color:var(--blue);word-break:break-all}

  .pre-wrap{position:relative}
  pre.code{margin:0;padding:13px 14px;overflow:auto;max-height:440px;background:#0b0f14;
    border-radius:0;color:#d7e0ea;tab-size:2;white-space:pre-wrap;overflow-wrap:anywhere}
  pre.code.short{max-height:none}
  .copy{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:6px;font-size:11px;
    color:var(--muted);background:rgba(15,19,25,.85);border:1px solid var(--line);backdrop-filter:blur(4px)}
  .copy:hover{color:var(--text);border-color:var(--accent-line)}
  .tok-key{color:#7dd3fc}
  .tok-str{color:#a7f3d0}
  .tok-num{color:#fbbf24}
  .tok-lit{color:#c084fc}
  .tok-pun{color:#66707d}

  /* flow */
  .flow{display:flex;flex-direction:column;gap:0;position:relative}
  .flow-node{display:flex;gap:12px;position:relative;padding-bottom:16px}
  .flow-node:last-child{padding-bottom:0}
  .flow-rail{display:flex;flex-direction:column;align-items:center;width:22px;flex:none}
  .flow-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);background:var(--bg);margin-top:4px;flex:none}
  .flow-dot.start{border-color:var(--blue)}
  .flow-dot.end{background:var(--accent);box-shadow:0 0 12px rgba(94,234,212,.5)}
  .flow-line{width:2px;flex:1;background:var(--line);margin-top:2px}
  .flow-node:last-child .flow-line{display:none}
  .flow-body{padding-bottom:2px;min-width:0}
  .flow-kind{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:650}
  .flow-title{font-weight:560;font-size:13.5px;margin-top:1px}
  .flow-meta{color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-top:2px;word-break:break-all}
  .edge-note{margin:2px 0 10px 34px;padding:7px 10px;border-left:2px solid var(--line);
    color:var(--text-dim);font-size:12px;background:var(--panel)}

  /* request cards */
  .req{margin-bottom:14px}
  .req-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line-soft);background:var(--panel-2)}
  .req-h .rid{font-family:var(--mono);font-size:12px;color:var(--text-dim)}
  .req-h .grades{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
  .req-meta{display:grid;grid-template-columns:150px 1fr;gap:0;font-size:12.5px;border-bottom:1px solid var(--line-soft)}
  .req-meta > div{padding:6px 14px}
  .req-meta > div:nth-child(odd){color:var(--muted);font-size:11.5px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .col{min-width:0}
  .col + .col{border-left:1px solid var(--line-soft)}
  .col-h{padding:7px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);
    font-weight:650;border-bottom:1px solid var(--line-soft);background:#0d1117;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .col-h .badge{margin-left:auto}
  .missing{padding:26px 14px;text-align:center;color:var(--muted);font-size:12.5px}
  .blocked{padding:12px 14px;background:rgba(248,113,113,.05);border-top:1px solid rgba(248,113,113,.2)}
  .blocked .bt{color:var(--g-unresolved);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:650;margin-bottom:6px}
  .blocked dl{display:grid;grid-template-columns:90px 1fr;gap:2px 10px;margin:0;font-size:12.5px}
  .blocked dt{color:var(--muted);font-size:11.5px}
  .blocked dd{margin:0;color:var(--text-dim)}
  .blocked ul{margin:2px 0 0;padding-left:16px;color:var(--text-dim)}
  .notes{color:var(--text-dim);font-size:13px}
  .callout{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--panel);color:var(--text-dim);font-size:12.5px;margin-bottom:14px}
  .callout .ico{color:var(--accent);font-weight:700}
  .callout.warn .ico{color:var(--g-representative)}
  ul.clean{margin:6px 0 0;padding-left:18px;color:var(--text-dim);font-size:12.5px}
  ul.clean li{margin:3px 0}
  .tablewrap{overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:650;background:var(--panel-2);white-space:nowrap}
  td:first-child{white-space:nowrap}
  td .filelink{white-space:nowrap}
  td .mono{word-break:break-word}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:1080px){.cols{grid-template-columns:1fr}.col + .col{border-left:0;border-top:1px solid var(--line-soft)}
    .grid2{grid-template-columns:1fr}}
  @media (max-width:860px){
    .shell{flex-direction:column}
    aside{width:100%;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}
    .page{padding:16px}
    .stats{width:100%;margin-left:0}
  }
  .kbd-hint{color:var(--faint);font-size:11px;font-family:var(--mono);padding:8px 14px;border-top:1px solid var(--line-soft)}
  footer.foot{padding:14px 26px;color:var(--faint);font-size:11.5px;border-top:1px solid var(--line);
    display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  footer.foot a{color:var(--muted)}
  /* empty state */
  .empty{display:grid;place-items:center;flex:1;padding:40px}
  .empty-card{max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 30px}
  .empty-card h1{font-size:20px;margin-bottom:8px}
  .empty-card p{color:var(--text-dim);font-size:13.5px}
  .empty-card pre{background:#0b0f14;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;color:#d7e0ea}
  .empty-card .badges{margin-top:14px}
</style>
</head>

/* ---------- tiny DOM helpers (never inject data as HTML) ---------- */
function el(tag, attrs, ...children){
  const n = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;         /* only for escaped/highlighted JSON */
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for (const c of children.flat()){
    if (c == null || c === false) continue;
    n.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
  return n;
}
const frag = (...kids) => { const f = document.createDocumentFragment(); for (const k of kids.flat()) if (k!=null) f.appendChild(typeof k==="string"?document.createTextNode(k):k); return f; };
const $ = (sel, root=document) => root.querySelector(sel);

function js(v){ return JSON.stringify(v, null, 2); }
function val(v, fallback="—"){ return (v===null||v===undefined||v==="") ? fallback : v; }
function pural(n, one, many){ return n + " " + (n === 1 ? one : many); }

/* ---------- safe JSON syntax highlight ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function highlightJson(value){
  const src = typeof value === "string" ? value : js(value);
  const tokenRe = /("(?:\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
  let out = "", last = 0, m;
  while ((m = tokenRe.exec(src))){
    out += escapeHtml(src.slice(last, m.index));
    const tok = m[0];
    if (m[1] !== undefined){
      const cls = m[2] ? "tok-key" : "tok-str";
      out += '<span class="'+cls+'">'+escapeHtml(m[1])+'</span>';
      if (m[2]) out += '<span class="tok-pun">'+escapeHtml(m[2])+'</span>';
    } else if (tok === "true" || tok === "false" || tok === "null"){
      out += '<span class="tok-lit">'+tok+'</span>';
    } else {
      out += '<span class="tok-num">'+escapeHtml(tok)+'</span>';
    }
    last = m.index + tok.length;
  }
  out += escapeHtml(src.slice(last));
  return out;
}

/* ---------- clipboard ---------- */
function copyText(text, btn){
  const done = () => { if (!btn) return; const old = btn.textContent; btn.textContent = "copied"; setTimeout(()=>{btn.textContent = old;}, 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta);
  ta.select(); try { document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta); done && done();
}

/* ---------- components ---------- */
function gradeBadge(grade){
  const g = GRADE_LABEL[grade] ? grade : "unresolved";
  return el("span", {class:"badge g-"+g, title:g}, g);
}
function siteGrades(cs){
  const grades = (cs.requests||[]).map(r => r.grade || r.request_grade || r.response_grade).filter(Boolean);
  const order = GRADES_SORTED(grades);
  return order;
}
function GRADES_SORTED(grades){
  const uniq = [...new Set(grades)].sort((a,b)=> GRADE_ORDER.indexOf(a)-GRADE_ORDER.indexOf(b));
  return uniq;
}
function gradeDots(cs){
  const grades = siteGrades(cs);
  if (!grades.length) return el("span", {class:"chip", title:"no payloads"}, "—");
  return el("span", {class:"chips", title:grades.join(" · ")}, grades.map(g => el("span", {
    class:"badge g-"+g, style:"padding:1px 6px;font-size:10px"
  }, g)));
}
function codeBlock(value, opts={}){
  const text = typeof value === "string" ? value : js(value);
  const pre = el("pre", {class:"code"+(opts.short?" short":"") , html: highlightJson(text)});
  const btn = el("button", {class:"copy", title:"copy to clipboard", onclick: () => copyText(text, btn)}, "copy");
  return el("div", {class:"pre-wrap"}, pre, btn);
}
function card(title, hint, body){
  return el("section", {class:"card"},
    el("div", {class:"card-h"}, el("span", {class:"t"}, title), hint ? el("span", {class:"hint"}, hint) : null),
    el("div", {class:"card-b"}, body)

    el("thead", null, el("tr", null, headers.map(h => el("th", null, h)))),
    el("tbody", null, rows.map(row => {
      const cells = Array.isArray(row) ? row : row.cells;
      const attrs = Array.isArray(row) ? null : row.attrs;
      return el("tr", attrs || null, cells.map(c => el("td", null, c)));
    }))
  ));
}
function sectionBody(kids){ return el("div", {class:"card-b"}, kids); }
function defList(entries){
  const d = el("div", {class:"kv"});
  for (const [k, v, opts] of entries){
    if (v === undefined) continue;
    d.appendChild(el("div", {class:"key"}, k));
    const value = (v && typeof v === "object" && !(v instanceof Node)) ? codeBlock(v, {short:true}) : (v instanceof Node ? v : val(v));
    d.appendChild(el("div", null, value));

}
function fileRef(ref){
  if (!ref) return "—";
  const f = typeof ref === "string" ? ref : ref.file;

  const line = typeof ref === "object" && ref.line != null ? ":"+ref.line : "";

  return eps.find(e => e.id === id) || (id ? {id, type:cs.trigger && cs.trigger.kind, trigger:cs.trigger && cs.trigger.detail} : null);
}

/* ---------- app ---------- */
const state = {selected:"__report__", tab:"overview", filter:""};
const TABS = [["overview","Overview"],["flow","Flow"],["prompt","Prompt"],["params","Params"],["io","Raw I/O"]];

function parseHash(){
  const raw = (location.hash || "").replace(/^#\/?/, "");
  if (!raw) return null;
  const [id, tab] = raw.split("/");
  return {id: id || null, tab: TABS.some(t => t[0] === tab) ? tab : null};
}
function syncHash(){
  const id = state.selected === "__report__" ? "report" : state.selected;
  const h = "#/" + id + "/" + state.tab;
  if (location.hash === h) return;
  try { history.replaceState(null, "", h); } catch (e) { location.hash = h; }
}
function setTab(tab){
  state.tab = tab;
  syncHash();
  renderMain();
}

function boot(){
  const root = $("#root");
  if (!MANIFEST){
    renderEmpty(root);
    return;
  }
  clear(root);
  const sites = MANIFEST.call_sites || [];
  const h = parseHash();
  if (h && h.id){
    if (h.id === "report") state.selected = "__report__";
    else if (sites.some(s => s.id === h.id)) state.selected = h.id;
    if (h.tab) state.tab = h.tab;
  }
  if (!state.selected || (state.selected !== "__report__" && !sites.some(s=>s.id===state.selected))){
    state.selected = sites.length ? sites[0].id : "__report__";
  }
  root.appendChild(renderHeader());
  const shell = el("div", {class:"shell"});
  shell.appendChild(renderSidebar());
  shell.appendChild(el("main", {id:"main"}));
  root.appendChild(shell);
  root.appendChild(renderFooter());
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    if (!h) return;
    if (h.id === "report") state.selected = "__report__";
    else if ((MANIFEST.call_sites || []).some(s => s.id === h.id)) state.selected = h.id;
    if (h.tab) state.tab = h.tab;
    renderMain();
  });
  renderMain();
}

function renderEmpty(root){
  clear(root);
  const g = GRADE_ORDER.map(g => el("span", {class:"badge g-"+g}, g));
  root.appendChild(el("div", {class:"empty"}, el("div", {class:"empty-card"},
    el("h1", null, "No manifest embedded"),

}

  }
  if (MANIFEST.redaction && (MANIFEST.redaction.rules||[]).length){
    out.push(callout("Redaction applied: " + MANIFEST.redaction.rules.join(" · "), "warn"));
  }
  return frag(out);
}
function callout(text, kind){
  return el("div", {class:"callout "+(kind||"")}, el("span", {class:"ico"}, kind==="warn"?"!":"i"), el("span", null, text));
}

/* ----- flow tab ----- */
function chainNodes(cs){
  const nodes = [];
  const ep = entrypointFor(cs);
  if (ep){
    nodes.push({kind:"entrypoint " + (ep.type||"trigger"), title: ep.id, meta: [ep.file ? ep.file + (ep.line!=null?":"+ep.line:"") : "", ep.trigger||"", ep.auth||"", ep.gating?"gating: "+ep.gating:""].filter(Boolean).join("  ·  ")});
  }
  (cs.call_chain||[]).forEach((step,i) => {
    nodes.push({kind: i===0 && !ep ? "entry" : "step "+(i+1), title: step.name || "(anonymous)", meta: [step.file ? step.file+(step.line!=null?":"+step.line:"") : ""].filter(Boolean).join("")});
  });
  nodes.push({kind:"llm call", title: [cs.provider, cs.model].filter(Boolean).join(" · ") || cs.id, meta: [cs.method, cs.location ? cs.location.file+(cs.location.line!=null?":"+cs.location.line:"") : ""].filter(Boolean).join("  ·  "), end:true});
  const wrap = el("div", {class:"flow"});
  nodes.forEach((n,i) => {
    wrap.appendChild(el("div", {class:"flow-node"},
      el("div", {class:"flow-rail"}, el("div", {class:"flow-dot "+(i===0?"start":"")+(n.end?" end":"")}), el("div", {class:"flow-line"})),
      el("div", {class:"flow-body"},
        el("div", {class:"flow-kind"}, n.kind),
        el("div", {class:"flow-title"}, n.title),
        n.meta ? el("div", {class:"flow-meta"}, n.meta) : null
      )
    ));
  });
  const out = [card("Execution flow", ep ? ep.id : null, wrap)];
  const edges = (MANIFEST.flow && MANIFEST.flow.edges || []).filter(e => (cs.trigger && e.to === cs.id) || (ep && e.from === ep.id) || e.to === cs.id);
  if (edges.length){
    const edgeNodes = edges.map(e => {
      const detail = [e.via ? "via "+e.via : "", e.when ? "when "+e.when : ""].filter(Boolean).join(" · ");
      return el("div", {class:"edge-note"},
        el("span", {class:"mono"}, e.from + "  →  " + e.to),
        detail ? el("div", null, detail) : null
      );
    });
    out.push(card("Flow edges", null, frag(edgeNodes)));
  }
  if (MANIFEST.flow && MANIFEST.flow.description){
    out.push(card("Flow description", null, el("div", {class:"notes"}, MANIFEST.flow.description)));
  }
  return frag(out);
}

/* ----- prompt tab ----- */
function renderPrompt(cs){
  const out = [];
  const sp = cs.system_prompt;
  if (sp){
    out.push(card("System prompt", sp.source ? [sp.source.type, sp.source.path ? sp.source.path+(sp.source.line?":"+sp.source.line:"") : "", "verbatim"].filter(Boolean).join(" · ") : "verbatim",
      frag(codeBlock(sp.text || "", {short:true}),
        (sp.dynamic_parts && sp.dynamic_parts.length) ? el("div", {style:"margin-top:10px"}, el("div", {class:"group-label", style:"padding-left:0;padding-top:0"}, "Dynamic parts"),
          el("div", {class:"chips"}, sp.dynamic_parts.map(p => el("span", {class:"chip"}, p)))) : null)));
  } else {
    out.push(card("System prompt", null, el("div", {class:"empty-note"}, "No system prompt for this call (e.g. embeddings, moderation, or instructions live in the messages).")));
  }
  if (cs.messages && cs.messages.template){
    out.push(card("Message template", cs.messages.assembly ? fileRef(cs.messages.assembly) : null, codeBlock(cs.messages.template)));
  }
  if (cs.messages && cs.messages.dynamic_inputs && cs.messages.dynamic_inputs.length){
    out.push(card("Dynamic inputs", "what varies per request", tableBlock(["Placeholder","Origin"],
      cs.messages.dynamic_inputs.map(d => [el("span", {class:"mono"}, d.placeholder||"—"), val(d.origin)]))));
  }
  if (cs.tools && cs.tools.length){
    out.push(card("Tools", pural(cs.tools.length, "tool", "tools") + " defined", frag(cs.tools.map(t => {
      const b = el("div", {style:"padding:10px 0;border-bottom:1px solid var(--line-soft)"},
        el("div", {style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap"},
          el("span", {class:"mono", style:"color:var(--accent)"}, t.name || "tool"),
          t.params_schema_file ? fileRef({file:t.params_schema_file, line:t.params_schema_line}) : null),
        t.description ? el("div", {class:"notes", style:"margin-top:4px"}, t.description) : null
      );
      return b;
    }))));
  }
  return frag(out);
}

/* ----- params tab ----- */
function renderParams(cs){
  const p = cs.params || {};
  const rows = Object.entries(p).map(([k,v]) => [k, (typeof v === "object" && v !== null) ? codeBlock(v, {short:true}) : String(v)]);
  return card("Model parameters", cs.id, rows.length ? defList(rows) : el("div", {class:"empty-note"}, "No parameters recorded."));
}

/* ----- raw I/O tab ----- */
function renderIO(cs){
  const reqs = cs.requests || [];
  const out = [];
  if (!reqs.length) out.push(card("Raw I/O", null, el("div", {class:"empty-note"}, "No payloads recorded for this call site.")));
  reqs.forEach(r => out.push(renderRequest(cs, r)));
  return frag(out);
}
function renderRequest(cs, r){
  const grade = r.grade || (r.request_grade && r.response_grade ? weakerGrade(r.request_grade, r.response_grade) : "unresolved");
  const reqGrade = r.request_grade || grade;
  const resGrade = r.response_grade || grade;
  const head = el("div", {class:"req-h"},
    el("span", {class:"rid"}, r.id || "request"),
    r.input_context ? el("span", {class:"chip", style:"max-width:52ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap", title:r.input_context}, r.input_context) : null,
    el("div", {class:"grades"},
      el("span", {class:"badge g-"+grade, title:"overall evidence for this interaction"}, grade),
      (reqGrade !== grade) ? el("span", {class:"badge g-"+reqGrade, title:"request evidence"}, "req: "+reqGrade) : null,
      (resGrade !== grade) ? el("span", {class:"badge g-"+resGrade, title:"response evidence"}, "res: "+resGrade) : null
    )
  );
  const metaRows = [
    ["Provenance", r.provenance ? [r.provenance.type, r.provenance.path, r.provenance.command].filter(Boolean).join(" · ") : "—"],
    ["Reproduce", r.reproduce || (r.provenance && r.provenance.command) || "—"],
    ["Redactions", (r.redactions && r.redactions.length) ? r.redactions.join(", ") : "none"],
    ["Captures", [r.request_file, r.response_file].filter(Boolean).join(" · ") || "—"],
    ["Note", r.note || undefined],
  ].filter(x => x[1] !== undefined);
  const meta = el("div", {class:"req-meta"});
  metaRows.forEach(([k,v]) => { meta.appendChild(el("div", {class:"key"}, k)); meta.appendChild(el("div", {class:"mono", style:"word-break:break-word"}, v)); });
  const body = el("div", {class:"card"}, head, meta,
    el("div", {class:"cols"},
      el("div", {class:"col"}, el("div", {class:"col-h"}, "Request", el("span", {class:"badge g-"+reqGrade}, reqGrade)), payloadOrMissing(r.request, "Request payload not captured.")),
      el("div", {class:"col"}, el("div", {class:"col-h"}, "Response", el("span", {class:"badge g-"+resGrade}, resGrade)), payloadOrMissing(r.response, "No response captured."))
    ),
    r.blocked ? blockedPanel(r.blocked) : null
  );
  return el("div", {class:"req"}, body);
}
function payloadOrMissing(payload, msg){
  if (payload === null || payload === undefined) return el("div", {class:"missing"}, msg);
  return el("div", {class:"card-b tight"}, codeBlock(payload));
}
function blockedPanel(b){
  return el("div", {class:"blocked"},
    el("div", {class:"bt"}, "Unresolved"),
    el("dl", null,
      el("dt", null, "Reason"), el("dd", null, val(b.reason)),
      b.needs ? frag(el("dt", null, "Needs"), el("dd", null, b.needs)) : null,
      (b.attempts && b.attempts.length) ? frag(el("dt", null, "Attempts"), el("dd", null, el("ul", null, b.attempts.map(a => el("li", null, a))))) : null
    )
  );
}
function weakerGrade(a, b){
  return GRADE_ORDER.indexOf(b) > GRADE_ORDER.indexOf(a) ? b : a;
}
function reqSummaryTable(cs){
  const reqs = cs.requests || [];
  if (!reqs.length) return el("div", {class:"empty-note"}, "No payloads recorded.");
  return tableBlock(["Id","Evidence","Input context","Reproduce"], reqs.map(r => [
    el("span", {class:"mono"}, r.id || "—"),
    r.grade ? gradeBadge(r.grade) : "—",
    r.input_context || (r.blocked && r.blocked.reason) || "—",
    el("span", {class:"mono"}, r.reproduce || (r.provenance && r.provenance.command) || "—")
  ]));
}

/* ----- report overview ----- */
function renderReportOverview(){
  const repo = MANIFEST.repo || {};
  const profile = MANIFEST.profile || {};
  const sum = MANIFEST.summary || {};
  const ev = sum.evidence || {};
  const sites = MANIFEST.call_sites || [];
  const eps = MANIFEST.entrypoints || [];
  const page = el("div", {class:"page"});
  page.appendChild(el("div", {class:"crumb"}, el("span", {class:"id"}, "report"), " · ", (MANIFEST.schema_version||"")));
  page.appendChild(el("h1", null, repo.name ? repo.name + " — LLM I/O map" : "LLM I/O map"));
  page.appendChild(el("div", {class:"subtitle"}, [
    pural(sites.length, "call site", "call sites"),
    pural(Object.values(ev).reduce((a,b)=>a+(b||0),0), "payload", "payloads"),
    profile.frameworks && profile.frameworks.length ? profile.frameworks.join(" · ") : null,
    MANIFEST.generated_at ? "generated " + MANIFEST.generated_at.replace("T"," ").slice(0,16) : null,
    repo.commit ? "commit " + repo.commit.slice(0,8) : null,
  ].filter(Boolean).map((x,i) => frag(i? el("span", {class:"sep"}, "·") : null, el("span", null, x)))));

  const rev = sum.response_evidence || null;
  const evCards = GRADE_ORDER.map(g => el("div", {class:"pill", title:"requests: "+g},
    el("span", {class:"dot", style:"background:var(--g-"+g+")"}), el("b", null, String(ev[g]||0)), g));
  const resCards = rev ? GRADE_ORDER.map(g => el("div", {class:"pill", title:"responses: "+g},
    el("span", {class:"dot", style:"background:var(--g-"+g+")"}), el("b", null, String(rev[g]||0)), g)) : null;
  page.appendChild(el("div", {class:"card"}, el("div", {class:"card-h"}, el("span", {class:"t"}, "Evidence breakdown"),
    el("span", {class:"hint"}, "graded by how each payload was obtained")),
    el("div", {class:"card-b"},
      el("div", {class:"group-label", style:"padding:0 0 6px"}, "Requests"),
      el("div", {class:"chips"}, evCards),
      resCards ? frag(el("div", {class:"group-label", style:"padding:14px 0 6px"}, "Responses"),
        el("div", {class:"chips"}, resCards)) : null)));

  if (eps.length){
    page.appendChild(card("Entrypoints", pural(eps.length, "trigger", "triggers"), tableBlock(
      ["Id","Type","Location","Trigger","Gating"],
      eps.map(e => [el("span", {class:"mono"}, e.id), val(e.type), fileRef({file:e.file,line:e.line}), val(e.trigger), val(e.gating)])
    )));
  }
  page.appendChild(card("Call sites", sites.length, tableBlock(
    ["","Name","Provider · model","Trigger","Evidence","Location"],
    sites.map(cs => ({
      attrs: {style:"cursor:pointer", onclick:()=>{ state.tab="overview"; select(cs.id); }},
      cells: [
        el("span", {class:"mono", style:"color:var(--faint)"}, cs.id),
        el("b", {style:"font-weight:560"}, cs.name || cs.id),
        [cs.provider, cs.model].filter(Boolean).join(" · "),
        (cs.trigger && (TRIGGER_LABEL[cs.trigger.kind]||cs.trigger.kind)) || "—",
        gradeDots(cs),
        fileRef(cs.location)
      ]
    }))
  )));

  const prof = [
    ["Languages", (profile.languages||[]).join(", ")],
    ["Package managers", (profile.package_managers||[]).join(", ")],
    ["Frameworks", (profile.frameworks||[]).join(", ")],
    ["Runnable here", profile.runnable === true ? "yes" : profile.runnable === false ? "no" : undefined],
  ].filter(r => r[1]);
  if (Array.isArray(MANIFEST.dismissed) && MANIFEST.dismissed.length){
    page.appendChild(card("Dismissed surfaces", pural(MANIFEST.dismissed.length, "candidate", "candidates") + " checked and ruled out",
      tableBlock(["Path / id","Category","Reason"],
        MANIFEST.dismissed.map(d => [el("span", {class:"mono"}, d.path || d.id || "—"), d.category || "—", d.reason || "—"]))));
  }
  if (prof.length) page.appendChild(card("Repo profile", null, defList(prof)));
  if (profile.evidence_sources && profile.evidence_sources.length){
    page.appendChild(card("Evidence sources found", profile.evidence_sources.length, tableBlock(
      ["Type","Path","Count"],
      profile.evidence_sources.map(s => [val(s.type), el("span", {class:"mono"}, val(s.path)), s.count != null ? String(s.count) : "—"])
    )));
  }
  if (MANIFEST.flow && MANIFEST.flow.description) page.appendChild(card("Application flow", null, el("div", {class:"notes"}, MANIFEST.flow.description)));
  if (MANIFEST.limitations && MANIFEST.limitations.length) page.appendChild(card("Limitations", null, el("ul", {class:"clean"}, MANIFEST.limitations.map(l => el("li", null, l)))));
  if (MANIFEST.redaction && (MANIFEST.redaction.rules||[]).length){
    page.appendChild(card("Redaction", "applied to " + ((MANIFEST.redaction.applied_to||[]).join(", ") || "captures"), el("ul", {class:"clean"}, MANIFEST.redaction.rules.map(r => el("li", null, el("span", {class:"mono"}, r))))));
  }
  return page;
}

function renderFooter(){
  return el("footer", {class:"foot"},
    el("span", null, "generated by "), el("b", null, "llm-io-map"),
    el("span", null, "·"), el("span", null, "every payload is graded by how it was obtained"),
    el("span", null, "·"), el("span", null, "offline, self-contained")
  );
}

/* ---------- keyboard ---------- */
function bindKeys(){
  if (window.__keysBound) return;
  window.__keysBound = true;
  document.addEventListener("keydown", (e) => {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const sites = MANIFEST.call_sites || [];
    const idx = sites.findIndex(s => s.id === state.selected);
    if (e.key === "j" || e.key === "ArrowDown"){ e.preventDefault(); const n = sites[Math.min(idx+1, sites.length-1)]; if (n) select(n.id); }
    else if (e.key === "k" || e.key === "ArrowUp"){ e.preventDefault(); const n = sites[Math.max(idx-1, 0)]; if (n) select(n.id); }
    else if (/^[1-5]$/.test(e.key) && state.selected !== "__report__"){ e.preventDefault(); setTab(TABS[Number(e.key)-1][0]); }
    else if (e.key === "/"){ e.preventDefault(); const s = $("#search"); if (s) s.focus(); }
  });
}

boot();
</script>
</body>
</html>
