<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>LLM I/O Map</title>
<style>
  /* ============================================================
     llm-io-map report — "forensic instrument" / editorial evidence
     Colors: ink & paper. Color is reserved for evidence grades.
     ============================================================ */
  :root{
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --r-lg:14px; --r-md:10px; --r-sm:7px;
    --ease:cubic-bezier(.2,0,0,1);
  }
  :root,[data-theme="dark"]{
    --paper:#0f0e0c; --paper-2:#15130f; --paper-3:#1b1813;
    --ink:#eee7d9; --ink-dim:#c2b9a8; --ink-mute:#8e8677; --ink-faint:#67604f;
    --rule:rgba(238,231,217,.15); --rule-soft:rgba(238,231,217,.075);
    --wash:rgba(238,231,217,.05); --wash-2:rgba(238,231,217,.085);
    --shadow:0 1px 0 rgba(0,0,0,.5),0 18px 40px -24px rgba(0,0,0,.85);
    --g-recorded:#7ad0a0; --g-serialized:#8fb8ff; --g-reconstructed:#c9a2ff;
    --g-representative:#f0c060; --g-unresolved:#ff9188;
  }
  [data-theme="light"]{
    --paper:#f7f2e6; --paper-2:#f2ecdd; --paper-3:#ebe3d1;
    --ink:#191710; --ink-dim:#453f34; --ink-mute:#6d6656; --ink-faint:#948b78;
    --rule:rgba(25,23,16,.17); --rule-soft:rgba(25,23,16,.08);
    --wash:rgba(25,23,16,.04); --wash-2:rgba(25,23,16,.075);
    --shadow:0 1px 0 rgba(25,23,16,.05),0 16px 36px -26px rgba(25,23,16,.55);
    --g-recorded:#1d7a4c; --g-serialized:#2a5aa8; --g-reconstructed:#6c3fa8;
    --g-representative:#8a5b00; --g-unresolved:#b02f2f;
  }
  *{box-sizing:border-box}
  main, .rail-scroll, .prompt-text, pre.code, .ledger-inner, .tabs{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
  main::-webkit-scrollbar,.rail-scroll::-webkit-scrollbar,.prompt-text::-webkit-scrollbar,pre.code::-webkit-scrollbar{width:10px;height:10px}
  main::-webkit-scrollbar-thumb,.rail-scroll::-webkit-scrollbar-thumb,.prompt-text::-webkit-scrollbar-thumb,pre.code::-webkit-scrollbar-thumb{background:var(--rule);border-radius:8px;border:2px solid transparent;background-clip:content-box}
  main::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);background-clip:content-box;border:2px solid transparent}
  html{scroll-behavior:smooth}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1100px 520px at 88% -12%, var(--wash), transparent 62%),
      radial-gradient(900px 500px at -10% 110%, var(--wash), transparent 55%),
      var(--paper);
    color:var(--ink);font:15px/1.55 var(--sans);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    font-variant-numeric:tabular-nums;
  }
  ::selection{background:var(--wash-2);color:var(--ink)}
  a{color:inherit;text-decoration:none}
  code,pre,.mono{font-family:var(--mono);font-variant-ligatures:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

  /* ---------- shell ---------- */
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  .top{border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--paper) 82%,transparent);
    backdrop-filter:blur(10px);position:sticky;top:0;z-index:40}
  .top-inner{display:flex;align-items:center;gap:16px;padding:11px 22px;max-width:1560px;margin:0 auto;width:100%}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .mark{width:26px;height:22px;position:relative;flex:none;color:var(--ink)}
  .mark i{position:absolute;left:0;right:0;height:1.5px;background:currentColor;display:block;border-radius:2px}
  .mark i:nth-child(1){top:2px;width:100%}
  .mark i:nth-child(2){top:10px;width:68%}
  .mark i:nth-child(3){top:18px;width:38%}
  .mark b{position:absolute;right:1px;top:6px;width:6px;height:6px;border-radius:50%;background:currentColor}
  .wordmark{font-family:var(--serif);font-size:19px;letter-spacing:-.015em;white-space:nowrap}
  .wordmark em{font-style:italic;color:var(--ink-mute);font-size:17px;margin:0 1px}
  .brand-sep{width:1px;height:22px;background:var(--rule);flex:none}
  .repo-block{min-width:0;display:flex;flex-direction:column;gap:0;line-height:1.25}
  .repo-name{font-family:var(--mono);font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .repo-meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-faint);white-space:nowrap}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid var(--rule);
    border-radius:var(--r-sm);color:var(--ink-dim);transition:background .15s var(--ease),color .15s var(--ease),transform .1s var(--ease)}
  .icon-btn:hover{background:var(--wash);color:var(--ink)}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn svg{width:15px;height:15px;display:block}
  .icon-btn .moon{display:none}
  [data-theme="dark"] .icon-btn .sun{display:none}
  [data-theme="dark"] .icon-btn .moon{display:block}
  .nav-toggle{display:none}

  /* readout strip */
  .ledger{border-bottom:1px solid var(--rule-soft);background:var(--paper-2);position:relative}
  .ledger::after{content:"";position:absolute;top:0;right:0;bottom:1px;width:34px;pointer-events:none;
    background:linear-gradient(to right,transparent,var(--paper-2));opacity:0}
  @media (max-width:860px){.ledger::after{opacity:1}}
  .ledger-inner{display:flex;align-items:stretch;gap:0;padding:0 22px;max-width:1560px;margin:0 auto;width:100%;overflow-x:auto;scrollbar-width:none}
  .ledger-inner::-webkit-scrollbar{display:none}
  .ld{padding:7px 15px 6px;border-left:1px solid var(--rule-soft);display:flex;align-items:baseline;gap:7px;white-space:nowrap;flex:none}
  .ld:first-child{border-left:0;padding-left:0}
  .ld .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
  .ld .v{font-family:var(--mono);font-size:13px;color:var(--ink)}
  .ld.g .v{color:var(--gc)}
  .ld.g .sw{width:6px;height:6px;border-radius:50%;background:var(--gc);flex:none;align-self:center}

  .shell{display:flex;flex:1;min-height:0;max-width:1560px;margin:0 auto;width:100%;overflow:hidden}
  /* ---------- sidebar ---------- */
  .rail{width:302px;flex:none;border-right:1px solid var(--rule);display:flex;flex-direction:column;
    min-height:0;overflow:hidden}
  .rail-scroll{overflow-y:auto;padding:16px 12px 22px;flex:1}
  .rail-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 9px}
  .rail-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint)}
  .search-wrap{position:relative;margin-bottom:14px}
  .search{width:100%;padding:8px 30px 8px 10px;border:1px solid var(--rule);border-radius:var(--r-sm);
    background:var(--paper-2);color:var(--ink);font-family:var(--mono);font-size:12px;outline:none;
    transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
  .search::placeholder{color:var(--ink-faint)}
  .search:focus{border-color:var(--ink-mute);box-shadow:0 0 0 3px var(--wash)}
  .search-wrap kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);
    font-size:10px;color:var(--ink-faint);border:1px solid var(--rule);border-radius:4px;padding:0 4px;line-height:16px}
  .ladder-mini{border:1px solid var(--rule-soft);border-radius:var(--r-md);padding:8px 10px;margin-bottom:16px;background:color-mix(in srgb,var(--paper-2) 60%,transparent)}
  .lamp-row{display:grid;grid-template-columns:8px 1fr auto;gap:7px;align-items:center;padding:2.5px 0}
  .lamp-row .sw{width:7px;height:7px;border-radius:50%;background:var(--gc)}
  .lamp-row .nm{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);letter-spacing:.02em}
  .lamp-row .ct{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)}
  .lamp-row.muted{opacity:.45}
  .grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
    display:flex;align-items:center;gap:8px;padding:14px 6px 6px}
  .grp::after{content:"";height:1px;background:var(--rule-soft);flex:1}
  .grp .n{color:var(--ink-faint)}
  .site{display:block;width:100%;text-align:left;padding:9px 10px 9px 11px;border-radius:var(--r-sm);
    border:1px solid transparent;position:relative;margin-bottom:2px;
    transition:background .13s var(--ease),border-color .13s var(--ease)}
  .site:hover{background:var(--wash)}
  .site[aria-current="true"]{background:var(--wash-2);border-color:var(--rule)}
  .site[aria-current="true"]::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--ink)}
  .site .nm{display:block;font-size:13px;font-weight:560;color:var(--ink);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .site .sub{display:flex;align-items:center;gap:6px;margin-top:3px;min-width:0}
  .site .sub .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);flex:none}
  .site .sub .m{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .site .loc{margin-top:2px;font-family:var(--mono);font-size:10px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gbar{display:inline-flex;gap:3px;align-items:center;flex:none;margin-left:auto}
  .gbar i{width:7px;height:7px;border-radius:50%;background:var(--gc)}
  .gbar.empty i{background:var(--ink-faint);opacity:.4}
  .rail-note{padding:10px 14px;border-top:1px solid var(--rule-soft);font-family:var(--mono);
    font-size:9.5px;letter-spacing:.06em;color:var(--ink-faint);display:flex;align-items:center;gap:7px}
  .rail-note b{color:var(--ink-mute);font-weight:500}

  /* ---------- main ---------- */
  main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;min-height:0;overscroll-behavior:contain}
  .page{width:100%;max-width:1080px;padding:34px 46px 90px;margin:0 auto}
  @media (max-width:1280px){.page{padding:30px 32px 80px}}
  .eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:var(--mono);
    font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:12px}
  .eyebrow .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--ink-faint)}
  .eyebrow .id{color:var(--ink-mute)}
  h1{font-family:var(--serif);font-weight:500;font-size:34px;line-height:1.14;letter-spacing:-.015em;
    margin:0 0 10px;text-wrap:balance;max-width:24ch}
  h2{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
  .lede{color:var(--ink-mute);font-size:14px;max-width:70ch;text-wrap:pretty}
  .subline{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--ink-mute)}
  .subline .sep{color:var(--ink-faint)}
  .subline .hl{color:var(--ink-dim)}
  .site-head{display:flex;align-items:flex-start;gap:26px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--rule)}
  .site-head .grow{min-width:0;flex:1 1 420px}
  .head-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
  .head-side .label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .head-side .rungs{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .head-side .rungs .line{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .head-side .rungs .line b{color:var(--ink-dim);font-weight:500}

  /* tabs */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20;
    background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);margin:0 -46px;padding:0 46px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs-wrap{position:relative}
  .tabs-wrap::after{content:"";position:absolute;top:0;right:0;bottom:1px;width:30px;pointer-events:none;
    background:linear-gradient(to right,transparent,var(--paper));opacity:0}
  @media (max-width:860px){.tabs-wrap::after{opacity:1}}
  @media (max-width:1280px){.tabs{margin:0 -32px;padding:0 32px}}
  .tab{position:relative;padding:13px 15px 12px;color:var(--ink-mute);font-size:13px;font-weight:500;
    white-space:nowrap;border-bottom:1.5px solid transparent;transition:color .13s var(--ease);display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--ink-dim)}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .tab .k{font-family:var(--mono);font-size:9.5px;color:var(--ink-faint);border:1px solid var(--rule-soft);
    border-radius:3px;padding:0 3px;line-height:14px}
  .tab[aria-selected="true"] .k{color:var(--ink-mute);border-color:var(--rule)}
  .panel{padding-top:26px;animation:panel .22s var(--ease) both}
  @keyframes panel{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* blocks */
  .block{margin:0 0 30px}
  .block-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
  .block-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
  .block-hint{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:auto;text-align:right}
  .block-body{min-width:0}
  .grid-2{display:grid;grid-template-columns:1.35fr 1fr;gap:34px}
  @media (max-width:980px){.grid-2{grid-template-columns:1fr;gap:26px}}

  /* meta list */
  .meta-grid{display:grid;grid-template-columns:132px 1fr;column-gap:18px}
  .meta-grid dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:7px 0;border-top:1px solid var(--rule-soft)}
  .meta-grid dd{margin:0;padding:7px 0;border-top:1px solid var(--rule-soft);font-size:13px;color:var(--ink-dim);min-width:0;overflow-wrap:anywhere}
  .meta-grid dt:first-of-type,.meta-grid dd:first-of-type{border-top:0;padding-top:0}
  .meta-grid .mono{font-size:12px}
  .muted{color:var(--ink-faint)}
  .linkish{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
  .file{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);overflow-wrap:anywhere}

  /* callout / when it runs */
  .when{border:1px solid var(--rule);border-left:2px solid var(--ink);border-radius:var(--r-md);
    padding:14px 16px;background:color-mix(in srgb,var(--paper-2) 55%,transparent)}
  .when-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .when-kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
  .when-detail{font-size:13.5px;color:var(--ink);font-weight:500}
  .when-line{font-family:var(--mono);font-size:11.5px;color:var(--ink-mute);margin-top:4px;overflow-wrap:anywhere}
  .when-gate{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule-soft);font-size:12.5px;color:var(--ink-dim)}
  .when-gate b{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:400;margin-right:7px}

  /* grade badges */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:1px 7px 1px 6px;border-radius:20px;
    font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--gc);
    border:1px solid color-mix(in srgb,var(--gc) 38%,transparent);
    background:color-mix(in srgb,var(--gc) 9%,transparent);white-space:nowrap;line-height:18px}
  .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
  .badge.plain{border-color:var(--rule);background:none;color:var(--ink-mute)}
  .badge.plain::before{background:var(--ink-faint)}
  .g-recorded{--gc:var(--g-recorded)}.g-serialized{--gc:var(--g-serialized)}
  .g-reconstructed{--gc:var(--g-reconstructed)}.g-representative{--gc:var(--g-representative)}
  .g-unresolved{--gc:var(--g-unresolved)}
  .sw-recorded{--gc:var(--g-recorded)}.sw-serialized{--gc:var(--g-serialized)}
  .sw-reconstructed{--gc:var(--g-reconstructed)}.sw-representative{--gc:var(--g-representative)}
  .sw-unresolved{--gc:var(--g-unresolved)}

  /* tables */
  .tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  .tbl thead th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:400;text-align:left;padding:0 12px 8px;white-space:nowrap;
    border-bottom:1px solid var(--rule)}
  .tbl thead th:first-child{padding-left:0}
  .tbl tbody td{padding:10px 12px;border-bottom:1px solid var(--rule-soft);vertical-align:top;color:var(--ink-dim)}
  .tbl tbody td:first-child{padding-left:0}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl tbody tr.clickable{cursor:pointer}
  .tbl tbody tr.clickable:hover td{background:var(--wash)}
  .tbl .strong{color:var(--ink);font-weight:520}
  .tbl .mono{font-size:11.5px}
  .tbl .num{text-align:right;white-space:nowrap}

  /* flow */
  .flow{position:relative;margin-top:2px}
  .fnode{display:grid;grid-template-columns:26px 1fr;gap:0 14px;position:relative}
  .fnode .rail{grid-row:1/span 1}
  .fnode:not(:last-child) .caret{position:absolute;left:12.5px;top:16px;bottom:-2px;width:1px;background:color-mix(in srgb,var(--ink-mute) 42%,transparent)}
  .fnode .cdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-mute);background:var(--paper);
    margin:5px 0 0 8.5px;position:relative;z-index:1}
  .fnode.start .cdot{border-color:var(--ink);background:var(--ink)}
  .fnode.end .cdot{border-color:var(--ink);background:var(--paper);box-shadow:0 0 0 3px var(--wash-2)}
  .fnode .fbody{padding:0 0 18px;min-width:0}
  .fnode .fkind{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
  .fnode .ftitle{font-size:14px;color:var(--ink);font-weight:520;margin:2px 0 1px;overflow-wrap:anywhere}
  .fnode .fmeta{font-family:var(--mono);font-size:10.5px;color:var(--ink-mute);overflow-wrap:anywhere}
  .fnode .fend{padding-bottom:0}
  .edge{margin:2px 0 14px 40px;padding:8px 12px;border-left:1px solid var(--rule);font-size:12px;color:var(--ink-mute)}
  .edge .e1{font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
  .edge .e2{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin-top:2px}

  /* prompt */
  .prompt-paper{border:1px solid var(--rule);border-radius:var(--r-md);background:var(--paper-2);overflow:hidden}
  .prompt-paper .pp-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule-soft)}
  .prompt-paper .pp-head .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
  .prompt-paper .pp-head .src{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prompt-text{padding:18px 20px;font-family:var(--mono);font-size:12.5px;line-height:1.75;color:var(--ink-dim);
    white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}

<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* The renderer replaces the marker below with the manifest JSON. */
const MANIFEST = /*__LLMMAP_MANIFEST__*/null;

const GRADE_ORDER = ["recorded","serialized","reconstructed","representative","unresolved"];
const GRADE_INFO = {
  recorded:       {n:"recorded",       d:"a real request/response already present in the repo (fixture, cassette, snapshot, log, eval dataset)"},
  serialized:     {n:"serialized",     d:"the exact request the SDK/wire code would send, captured by running the real path against a stub"},
  reconstructed:  {n:"reconstructed",  d:"exact for a stated input, derived statically from the code path"},
  representative: {n:"representative", d:"shape and example for dynamic parts — explicitly not a capture"},
  unresolved:     {n:"unresolved",     d:"not obtainable here; reason and cheapest unblock are recorded"}
};
const TRIGGER_LABEL = {http:"HTTP route", job:"job", cron:"cron", queue:"queue", webhook:"webhook",
  cli:"CLI", ide:"IDE event", event:"event", other:"other"};
const TABS = [["overview","Overview"],["flow","Flow"],["prompt","Prompt"],["params","Params"],["io","Raw I/O"]];

/* ---------------- DOM helpers (data is never injected as raw HTML) ---------------- */
function el(tag, attrs, ...children){
  const n = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)){
    const v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;            /* escaped/highlighted output only */
    else if (k === "style" && typeof v === "object") Object.assign(n.style, v);
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  addChildren(n, children);
  return n;
}
function addChildren(n, children){
  for (const c of children.flat(6)){
    if (c === undefined || c === null || c === false) continue;
    n.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  }
}
function frag(...children){ const f = document.createDocumentFragment(); addChildren(f, children); return f; }
function clear(n){ while (n && n.firstChild) n.removeChild(n.firstChild); return n; }
function $(sel, root){ return (root || document).querySelector(sel); }
function js(v){ return JSON.stringify(v, null, 2); }
function val(v, fb){ return v === null || v === undefined || v === "" ? (fb || "—") : v; }
function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }
function pct(a, b){ if (!a || b <= 0) return 0; return Math.max(3, Math.round((a / b) * 100)); }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------------- JSON syntax highlighting (safe: escape then wrap tokens) ---------------- */
function highlightJson(value){
  const src = typeof value === "string" ? value : js(value);
  const re = /("(?:\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))){
    out += escapeHtml(src.slice(last, m.index));
    if (m[1] !== undefined){
      out += '<span class="tok-' + (m[2] ? "key" : "str") + '">' + escapeHtml(m[1]) + "</span>";
      if (m[2]) out += '<span class="tok-pun">' + escapeHtml(m[2]) + "</span>";
    } else if (m[0] === "true" || m[0] === "false" || m[0] === "null"){
      out += '<span class="tok-lit">' + m[0] + "</span>";
    } else {
      out += '<span class="tok-num">' + escapeHtml(m[0]) + "</span>";
    }
    last = m.index + m[0].length;
  }
  out += escapeHtml(src.slice(last));
  return out;
}
/* highlight {placeholders} in prompt text, built from text nodes only */
function placeholderText(text){
  const s = String(text);
  const f = document.createDocumentFragment();
  const re = /\{[a-zA-Z0-9_.\-\[\]]+\}|\$[a-zA-Z_][a-zA-Z0-9_]*/g;
  let last = 0, m;
  while ((m = re.exec(s))){
    if (m.index > last) f.appendChild(document.createTextNode(s.slice(last, m.index)));
    f.appendChild(el("span", {class:"ph"}, m[0]));
    last = m.index + m[0].length;
  }
  if (last < s.length) f.appendChild(document.createTextNode(s.slice(last)));
  return f;
}

/* ---------------- theme ---------------- */
const THEME_KEY = "llm-io-map-theme";
function getTheme(){
  try {
    const q = new URLSearchParams(location.search || "").get("theme");
    if (q === "light" || q === "dark") return q;
  } catch (e) {}
  try { const t = localStorage.getItem(THEME_KEY); if (t === "light" || t === "dark") return t; } catch (e) {}
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  const btn = $("#theme-btn");
  if (btn) btn.setAttribute("aria-label", t === "dark" ? "switch to light theme" : "switch to dark theme");
}

/* ---------------- clipboard + toast ---------------- */
let toastTimer = null;
function toast(msg){
  const t = $("#toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1500);
}
function copyText(text, btn){
  const done = () => { toast("copied"); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta); done();
}

/* ---------------- state + routing ---------------- */
const state = { selected: "__report__", tab: "overview", filter: "" };
function parseHash(){
  const raw = (location.hash || "").replace(/^#\/?/, "");
  if (!raw) return null;
  const parts = raw.split("/");
  return { id: parts[0] || null, tab: TABS.some(t => t[0] === parts[1]) ? parts[1] : null };
}
function syncHash(){
  const id = state.selected === "__report__" ? "report" : state.selected;
  const h = "#/" + id + "/" + state.tab;
  if (location.hash === h) return;
  try { history.replaceState(null, "", h); } catch (e) { location.hash = h; }
}
function setTab(tab){ state.tab = tab; syncHash(); renderMain(); }
function select(id, tab){
  state.selected = id;
  if (tab) state.tab = tab;
  syncHash();
  document.querySelectorAll(".site").forEach(b => {
    const isCur = b.dataset.id === id || (id === "__report__" && b.dataset.id === "__report__");
    b.setAttribute("aria-current", isCur ? "true" : "false");
  });
  renderMain();
  const main = $("#main"); if (main) main.scrollTop = 0;
  window.scrollTo(0, 0);
}

/* ---------------- small components ---------------- */
function badge(grade, extra){
  const g = GRADE_INFO[grade] ? grade : "unresolved";

}
function fileChip(file, line, endLine){

  return el("span", {class:"file"}, loc);

function metaRow(label, value){

}
function metaGrid(rows){

function block(title, hint, body){

    el("div", {class:"block-head"}, el("h3", {class:"block-title"}, title), hint ? el("span", {class:"block-hint"}, hint) : null),

function codePane(payload, opts){
  const o = opts || {};
  const body = el("div", {class:"pane-body"});
  if (payload === null || payload === undefined){
    body.appendChild(el("div", {class:"empty-pane"}, el("div", {class:"big"}, o.emptyTitle || "–"), el("div", null, o.emptyText || "No payload captured.")));
  } else {
    const text = typeof payload === "string" ? payload : js(payload);
    const pre = el("pre", {class:"code", html: highlightJson(text)});
    const toggle = el("button", {class:"code-toggle", type:"button", onclick: () => {
      const full = pre.classList.toggle("full");
      toggle.textContent = full ? "collapse" : "expand";
      const mask = $(".fade-mask", body); if (mask) mask.style.display = full ? "none" : "";
    }}, "expand");
    body.appendChild(pre); body.appendChild(el("div", {class:"fade-mask"}));
    body.appendChild(el("div", {class:"pane-foot"},
      el("span", {class:"fnote"}, text.split("\n").length + " lines · " + new Blob([text]).size.toLocaleString() + " B"),
      el("span", {class:"sp", style:{marginLeft:"auto"}}),
      toggle,
      el("button", {class:"code-toggle", type:"button", onclick: () => copyText(text, null)}, "copy")

/* ---------------- shell ---------------- */
function boot(){
  setTheme(getTheme());
  const root = $("#app");
  if (!MANIFEST){ renderEmpty(root); return; }
  clear(root);
  root.appendChild(renderTop());
  root.appendChild(renderLedger());
  const shell = el("div", {class:"shell"});
  shell.appendChild(renderRail());
  shell.appendChild(el("div", {class:"rail-backdrop", onclick: () => document.body.classList.remove("rail-open")}));
  shell.appendChild(el("main", {id:"main"}));
  root.appendChild(shell);
  root.appendChild(renderFoot());
  const h = parseHash();
  const sites = MANIFEST.call_sites || [];
  if (h && h.id){
    if (h.id === "report") state.selected = "__report__";
    else if (sites.some(s => s.id === h.id)) state.selected = h.id;
    if (h.tab) state.tab = h.tab;
  }
  if (state.selected !== "__report__" && !sites.some(s => s.id === state.selected)){
    state.selected = sites.length ? sites[0].id : "__report__";
  }
  try { document.title = (MANIFEST.repo && MANIFEST.repo.name ? MANIFEST.repo.name + " · " : "") + "LLM I/O map"; } catch (e) {}
  window.addEventListener("hashchange", () => {
    const p = parseHash();
    if (!p) return;
    if (p.id === "report") state.selected = "__report__";
    else if (sites.some(s => s.id === p.id)) state.selected = p.id;
    if (p.tab) state.tab = p.tab;
    renderMain();
  });
  bindKeys();
  renderMain();
  document.documentElement.classList.add("ready");
}

function renderLedger(){
  const sum = MANIFEST.summary || {};
  const ev = sum.evidence || {};
  const rev = sum.response_evidence || {};
  const sites = (MANIFEST.call_sites || []).length;

  const cells = [
    el("div", {class:"ld"}, el("span", {class:"k"}, "call sites"), el("span", {class:"v"}, String(sites))),
    el("div", {class:"ld"}, el("span", {class:"k"}, "payloads"), el("span", {class:"v"}, String(payloads)))
  ];

    cells.push(el("div", {class:"ld g sw-" + g, title: GRADE_INFO[g].d},
      el("span", {class:"sw"}), el("span", {class:"v"}, String(ev[g] || 0)), el("span", {class:"k"}, g)));
  }

function renderRail(){
  const sites = MANIFEST.call_sites || [];
  const ev = (MANIFEST.summary || {}).evidence || {};
  const rail = el("aside", {class:"rail", "aria-label":"call sites"});
  const scroll = el("div", {class:"rail-scroll"});
  rail.appendChild(scroll);
  scroll.appendChild(el("div", {class:"search-wrap"},
    el("label", {class:"sr", for:"search"}, "Filter call sites"),
    el("input", {class:"search", id:"search", type:"search", placeholder:"filter sites, providers, files…", value: state.filter,
      oninput: (e) => { state.filter = e.target.value.toLowerCase(); filterSites(); }}),
    el("kbd", null, "/")
  ));
  const ladder = el("div", {class:"ladder-mini", "aria-label":"evidence ladder totals"});
  for (const g of GRADE_ORDER){
    const n = ev[g] || 0;
    ladder.appendChild(el("div", {class:"lamp-row " + (n ? "" : "muted"), title: GRADE_INFO[g].d},
      el("span", {class:"sw sw-" + g}), el("span", {class:"nm"}, g), el("span", {class:"ct"}, String(n))));
  }
  scroll.appendChild(ladder);
  scroll.appendChild(el("div", {class:"grp"}, el("span", null, "Report"), el("span", {class:"n"}, "·")));
  scroll.appendChild(railButton({id:"__report__", name:"All call sites & evidence", trigger:"report", sub:"evidence ladder · entrypoints · dismissed"}, true));
  const byTrigger = new Map();
  for (const cs of sites){

function railButton(cs, isReport){
  const trig = isReport ? "report" : ((cs.trigger && cs.trigger.kind) || "other");
  const meta = isReport ? (MANIFEST.repo && MANIFEST.repo.name) || "" : [cs.provider, cs.model].filter(Boolean).join(" · ");
  const loc = isReport ? "" : (cs.location && cs.location.file) || "";
  const grades = isReport ? [] : siteGrades(cs);
  const btn = el("button", {class:"site", type:"button", "data-id": cs.id,
    "aria-current": (state.selected === cs.id) ? "true" : "false",
    "data-search": [cs.id, cs.name, trig, meta, loc].filter(Boolean).join(" ").toLowerCase(),
    onclick: () => { document.body.classList.remove("rail-open"); select(cs.id, isReport ? "overview" : state.tab); }},
    el("span", {class:"nm"}, isReport ? "All call sites & evidence" : (cs.name || cs.id)),
    el("span", {class:"sub"},
      el("span", {class:"t"}, isReport ? "report" : (TRIGGER_LABEL[trig] || trig)),
      el("span", {class:"m"}, meta || ""),
      grades.length ? gbar(grades) : null),
    loc ? el("span", {class:"loc"}, loc) : null
  );
  return btn;
}
function siteGrades(cs){
  const reqs = cs.requests || [];
  const out = [];
  for (const r of reqs){
    const g = r.grade || r.request_grade;
    if (g) out.push(g);
  }
  return [...new Set(out)].sort((a,b) => GRADE_ORDER.indexOf(a) - GRADE_ORDER.indexOf(b));
}
function gbar(grades){
  if (!grades.length) return el("span", {class:"gbar empty"}, el("i"));
  return el("span", {class:"gbar"}, grades.map(g => el("i", {class:"sw-" + g, title: g})));
}
function filterSites(){
  const q = state.filter;
  document.querySelectorAll(".site").forEach(b => {
    b.style.display = !q || (b.dataset.search || "").includes(q) ? "" : "none";
  });
  document.querySelectorAll(".grp").forEach(g => {
    let n = g.nextElementSibling, any = false;
    while (n && !n.classList.contains("grp")){
      if (n.classList && n.classList.contains("site") && n.style.display !== "none") any = true;
      n = n.nextElementSibling;
    }
    g.style.display = any ? "" : "none";
  });
}

function entrypointFor(cs){

function renderPanel(cs){

  const metaRows = [

    ["model resolves", cs.model_resolution ? el("span", null,
      el("span", {class:"mono"}, [cs.model_resolution.source, cs.model_resolution.default ? "default " + cs.model_resolution.default : ""].filter(Boolean).join(" · ")),
      cs.model_resolution.file ? frag(el("span", {class:"muted"}, "  ·  "), fileChip(cs.model_resolution.file, cs.model_resolution.line)) : null) : null],

  out.push(block("Payloads", plural((cs.requests || []).length, "interaction", "interactions"), payloadTable(cs)));

function payloadTable(cs){
  const reqs = cs.requests || [];

/* ---------------- flow tab ---------------- */
function flowChain(cs, withEdges){
  const ep = entrypointFor(cs);
  const nodes = [];
  if (ep){
    nodes.push({kind: "entrypoint · " + (ep.type || "trigger"), title: ep.id,
      meta: [ep.file ? ep.file + (ep.line ? ":" + ep.line : "") : "", ep.trigger || "", ep.auth || "", ep.gating ? "gating: " + ep.gating : ""].filter(Boolean).join("  ·  "), start: true});
  }
  (cs.call_chain || []).forEach((step, i) => {
    nodes.push({kind: (i === 0 && !ep ? "entry" : "step " + (i + 1)), title: step.name || "(anonymous)",
      meta: step.file ? step.file + (step.line !== undefined && step.line !== null ? ":" + step.line : "") : ""});
  });
  nodes.push({kind: "LLM call", title: [cs.provider, cs.model].filter(Boolean).join(" · ") || (cs.name || cs.id),
    meta: [cs.method, cs.location ? cs.location.file + (cs.location.line ? ":" + cs.location.line : "") : ""].filter(Boolean).join("  ·  "), end: true});
  const flow = el("div", {class:"flow"});
  nodes.forEach((n, i) => {
    const node = el("div", {class:"fnode " + (n.start ? "start" : "") + " " + (n.end ? "end" : "")},
      el("div", {class:"cdot"}),
      el("div", {class:"fbody"},
        el("div", {class:"fkind"}, n.kind),
        el("div", {class:"ftitle"}, n.title),
        n.meta ? el("div", {class:"fmeta"}, n.meta) : null),
      i < nodes.length - 1 ? el("div", {class:"caret"}) : null
    );
    flow.appendChild(node);
  });
  const out = [flow];
  if (withEdges){
    const edges = (MANIFEST.flow && MANIFEST.flow.edges) || [];
    const rel = edges.filter(e => (ep && e.from === ep.id) || e.to === cs.id);
    for (const e of rel){
      out.push(el("div", {class:"edge"},
        el("div", {class:"e1"}, e.from + "  →  " + e.to),
        (e.via || e.when) ? el("div", {class:"e2"}, [e.via ? "via " + e.via : "", e.when ? "when " + e.when : ""].filter(Boolean).join("  ·  ")) : null));
    }
  }
  return frag(out);
}
function renderFlow(cs){
  const out = [];
  out.push(block("Execution flow", "entrypoint → LLM call", flowChain(cs, true)));
  if (MANIFEST.flow && MANIFEST.flow.description){
    out.push(block("Application flow", null, el("p", {class:"lede"}, MANIFEST.flow.description)));
  }
  return frag(out);
}

/* ---------------- prompt tab ---------------- */
function renderPrompt(cs){
  const out = [];
  const sp = cs.system_prompt;
  if (sp){
    const paper = el("div", {class:"prompt-paper"},
      el("div", {class:"pp-head"},
        el("span", {class:"t"}, "system prompt"),
        el("button", {class:"code-toggle", type:"button", onclick: () => copyText(sp.text || "", null)}, "copy"),
        el("span", {class:"src"}, [sp.source && sp.source.type, sp.source && sp.source.path ? sp.source.path + (sp.source.line ? ":" + sp.source.line : "") : ""].filter(Boolean).join(" · ") || "verbatim")
      ),
      el("div", {class:"prompt-text"}, placeholderText(sp.text || "")),
      (sp.dynamic_parts && sp.dynamic_parts.length) ? el("div", {class:"ph-label"},
        el("span", {class:"t"}, "dynamic parts"),
        sp.dynamic_parts.map(p => el("span", {class:"chip"}, p))) : null
    );
    out.push(block("Prompt", "verbatim · placeholders highlighted", paper));
  } else {
    out.push(block("Prompt", null, el("p", {class:"lede muted"}, "No system prompt for this call (e.g. embeddings, moderation, or instructions live in the messages).")));
  }
  if (cs.messages && cs.messages.template){
    const msgs = Array.isArray(cs.messages.template) ? cs.messages.template : null;
    const t = el("div", {class:"transcript"});
    if (msgs){
      for (const m of msgs){
        const role = String(m.role || "message");
        const content = typeof m.content === "string" ? m.content : js(m.content);
        t.appendChild(el("div", {class:"msg " + (role === "system" ? "system" : role === "user" ? "user" : "")},
          el("div", {class:"msg-role"}, role),
          el("div", {class:"msg-body"}, placeholderText(content))));
      }
    } else {
      t.appendChild(el("div", {class:"msg-empty"}, "Message template is not a list of role/content messages."));
    }
    out.push(block("Messages", "template · placeholders highlighted", t));
    if (cs.messages.assembly){
      out.push(block("Message assembly", null, metaGrid([
        ["file", fileChip(cs.messages.assembly.file, cs.messages.assembly.line)],
        ["note", cs.messages.assembly.note || "—"]
      ])));
    }
  }
  if (cs.messages && cs.messages.dynamic_inputs && cs.messages.dynamic_inputs.length){
    out.push(block("Dynamic inputs", "what varies per request",
      el("div", {style:{overflowX:"auto"}},
        el("table", {class:"tbl"},
          el("thead", null, el("tr", null, ["placeholder", "origin"].map(h => el("th", null, h)))),
          el("tbody", null, cs.messages.dynamic_inputs.map(d => el("tr", null,
            el("td", null, el("span", {class:"chip"}, d.placeholder || "—")),
            el("td", null, val(d.origin)))))
        ))));
  }
  if (cs.tools && cs.tools.length){
    const list = el("div");
    for (const t of cs.tools){
      list.appendChild(el("details", {class:"tool"},
        el("summary", null, el("span", {class:"tname"}, t.name || "tool"),
          t.params_schema_file ? frag("  ", fileChip(t.params_schema_file, t.params_schema_line)) : null,
          t.description ? el("span", {class:"muted", style:{marginLeft:"auto",fontSize:"11.5px"}}, "description") : null),
        t.description ? el("div", {class:"tdesc"}, t.description) : null,
        t.params_schema ? el("pre", null, js(t.params_schema)) : null
      ));
    }
    out.push(block("Tools", plural(cs.tools.length, "tool", "tools") + " available to the model", list));
  }
  return frag(out);
}

/* ---------------- params tab ---------------- */
function renderParams(cs){
  const p = cs.params || {};
  const keys = Object.keys(p);
  if (!keys.length) return block("Model parameters", null, el("p", {class:"lede muted"}, "No parameters recorded."));
  const grid = el("div", {class:"pgrid"});
  for (const k of keys){
    const v = p[k];
    let node;
    if (v === null) node = el("span", {class:"muted"}, "null");
    else if (typeof v === "boolean") node = el("span", {class:"pbool " + (v ? "on" : "")}, v ? "true" : "false");
    else if (typeof v === "object") node = el("span", {class:"mono"}, JSON.stringify(v));
    else node = el("span", null, String(v));
    grid.appendChild(el("div", {class:"pcell"}, el("div", {class:"pk"}, k), el("div", {class:"pv"}, node)));
  }
  return block("Model parameters", plural(keys.length, "setting", "settings"), grid);
}

/* ---------------- raw I/O tab ---------------- */
function renderIO(cs){
  const reqs = cs.requests || [];
  if (!reqs.length) return block("Raw I/O", null, el("p", {class:"lede muted"}, "No payloads recorded for this call site."));
  const out = [];
  for (const r of reqs) out.push(interaction(cs, r));
  return frag(out);
}
function interaction(cs, r){
  const reqG = r.grade || r.request_grade || "unresolved";
  const resG = r.response_grade || (r.response == null ? "unresolved" : reqG);
  const head = el("div", {class:"io-head"},
    el("span", {class:"iid"}, r.id || "interaction"),
    r.input_context ? el("span", {class:"ictx", title: r.input_context}, r.input_context) : null,
    el("span", {class:"igrades"}, badge(reqG), resG !== reqG ? badge(resG) : null)
  );
  const meta = el("div", {class:"io-meta"});
  const rows = [
    ["provenance", r.provenance ? [r.provenance.type, r.provenance.path, r.provenance.command].filter(Boolean).join(" · ") : "—"],
    ["reproduce", r.reproduce || (r.provenance && r.provenance.command) || "—"],
    ["redactions", (r.redactions && r.redactions.length) ? r.redactions.join(", ") : "none"],
    ["captures", [r.request_file || "request pending", r.response_file || "response pending"].join("  ·  ")],
    ["note", r.note]
  ].filter(x => x[1] !== undefined && x[1] !== null);
  for (const [k, v] of rows){
    meta.appendChild(el("div", {class:"mk"}, k));
    meta.appendChild(el("div", {class:"mv"}, typeof v === "string" ? el("span", null, v) : v));
  }
  const left = el("div", {class:"pane"},
    el("div", {class:"pane-head"}, el("span", {class:"pt"}, "request"), el("span", {class:"sp"}, badge(reqG))),
    codePane(r.request, {emptyTitle: "not captured", emptyText: "No request payload for this interaction."})
  );
  const right = el("div", {class:"pane"},
    el("div", {class:"pane-head"}, el("span", {class:"pt"}, "response"), el("span", {class:"sp"}, badge(resG))),
    codePane(r.response, {emptyTitle: "no response captured", emptyText: "The request was captured; the model output was not recorded."})
  );
  const panes = el("div", {class:"io-panes" + (r.response == null ? " single" : "")}, left, r.response == null ? null : right);
  const wrap = el("div", {class:"io"}, head, meta, panes);
  if (r.response == null && r.blocked){
    wrap.appendChild(el("div", {class:"blocked"},
      el("div", {class:"bt"}, "why this is unresolved"),
      el("dl", null,
        el("dt", null, "reason"), el("dd", null, val(r.blocked.reason)),
        r.blocked.needs ? frag(el("dt", null, "needs"), el("dd", null, r.blocked.needs)) : null,
        (r.blocked.attempts && r.blocked.attempts.length) ? frag(el("dt", null, "attempted"), el("dd", null, el("ul", null, r.blocked.attempts.map(a => el("li", null, a))))) : null
      )
    ));
  }
  return wrap;
}

/* ---------------- report overview ---------------- */
function renderReport(){
  const repo = MANIFEST.repo || {};
  const profile = MANIFEST.profile || {};
  const sum = MANIFEST.summary || {};
  const ev = sum.evidence || {};
  const rev = sum.response_evidence || {};
  const sites = MANIFEST.call_sites || [];
  const eps = MANIFEST.entrypoints || [];

  const page = el("div", {class:"page"});
  page.appendChild(el("div", {class:"report-head"},
    el("div", {class:"eyebrow"}, el("span", null, "report"), el("span", {class:"dot-sep"}), el("span", {class:"id"}, "llm i/o map")),
    el("h1", null, repo.name ? repo.name : "LLM I/O map"),
    el("p", {class:"lede"}, "Every place this codebase calls a model, what is sent and returned, and how much of it is actually evidence."),
    el("div", {class:"meta-row"},
      [["branch", repo.branch], ["commit", repo.commit ? repo.commit.slice(0, 8) : null], ["generated", MANIFEST.generated_at ? MANIFEST.generated_at.replace("T", " ").slice(0, 16) : null], ["schema", MANIFEST.schema_version]]
        .filter(x => x[1]).map(([k, v]) => el("span", {class:"meta-chip"}, el("span", {class:"l"}, k), el("span", null, v))),
      (profile.frameworks && profile.frameworks.length) ? el("span", {class:"meta-chip"}, el("span", {class:"l"}, "stack"), el("span", null, profile.frameworks.join(" · "))) : null
    )
  ));

  page.appendChild(renderStats(sites, ev, eps));
  page.appendChild(renderLadderHero(ev, rev));
  if (eps.length) page.appendChild(block("Entrypoints", "what makes the model fire",
    el("div", {style:{overflowX:"auto"}}, el("table", {class:"tbl"},
      el("thead", null, el("tr", null, ["id", "type", "location", "trigger", "gating"].map(h => el("th", null, h)))),
      el("tbody", null, eps.map(e => el("tr", null,
        el("td", null, el("span", {class:"mono"}, e.id)),
        el("td", null, val(e.type)),
        el("td", null, fileChip(e.file, e.line)),
        el("td", null, val(e.trigger)),
        el("td", null, val(e.gating))
      ))))
    )));
  if (sites.length) page.appendChild(block("Call sites", plural(sites.length, "site", "sites"),
    el("div", {style:{overflowX:"auto"}}, el("table", {class:"tbl"},
      el("thead", null, el("tr", null, ["", "name", "provider · model", "trigger", "evidence", "location"].map(h => el("th", null, h)))),
      el("tbody", null, sites.map(cs => el("tr", {class:"clickable", onclick: () => select(cs.id, "overview")},
        el("td", null, el("span", {class:"mono"}, cs.id)),
        el("td", null, el("span", {class:"strong"}, cs.name || cs.id)),
        el("td", null, [cs.provider, cs.model].filter(Boolean).join(" · ")),
        el("td", null, (cs.trigger && (TRIGGER_LABEL[cs.trigger.kind] || cs.trigger.kind)) || "—"),
        el("td", null, gbar(siteGrades(cs))),
        el("td", null, fileChip(cs.location && cs.location.file, cs.location && cs.location.line))
      ))))
    )));
  if (Array.isArray(MANIFEST.dismissed) && MANIFEST.dismissed.length){
    page.appendChild(block("Dismissed surfaces", plural(MANIFEST.dismissed.length, "candidate", "candidates") + " checked and ruled out",
      el("div", {style:{overflowX:"auto"}}, el("table", {class:"tbl"},
        el("thead", null, el("tr", null, ["path / id", "category", "reason"].map(h => el("th", null, h)))),
        el("tbody", null, MANIFEST.dismissed.map(d => el("tr", null,
          el("td", null, el("span", {class:"mono"}, d.path || d.id || "—")),
          el("td", null, el("span", {class:"chip"}, d.category || "—")),
          el("td", null, d.reason || "—")
        ))))
      )));
  }
  const prof = [
    ["languages", (profile.languages || []).join(", ")],
    ["package managers", (profile.package_managers || []).join(", ")],
    ["frameworks", (profile.frameworks || []).join(", ")],
    ["runnable here", profile.runnable === true ? "yes" : profile.runnable === false ? "no" : null]
  ].filter(r => r[1]);
  const sideBlocks = [];
  if (prof.length) sideBlocks.push(block("Repo profile", null, metaGrid(prof.map(r => [r[0], el("span", {class:"mono"}, r[1])]))));
  if (profile.evidence_sources && profile.evidence_sources.length){
    sideBlocks.push(block("Evidence sources", plural(profile.evidence_sources.length, "source", "sources"),
      metaGrid(profile.evidence_sources.map(s => [s.type || "source", frag(
        el("span", {class:"mono"}, val(s.path)),
        s.count !== undefined && s.count !== null ? el("span", {class:"muted"}, "  ·  " + s.count) : null)]))));
  }
  if (sideBlocks.length){
    const g = el("div", {class:"grid-2"});
    g.appendChild(el("div", null, sideBlocks));
    const right = [];
    if (MANIFEST.flow && MANIFEST.flow.description) right.push(block("Application flow", null, el("p", {class:"lede"}, MANIFEST.flow.description)));
    if (MANIFEST.limitations && MANIFEST.limitations.length) right.push(block("Limitations", null, el("ul", {class:"clean"}, MANIFEST.limitations.map(l => el("li", null, l)))));
    if (MANIFEST.redaction && (MANIFEST.redaction.rules || []).length) right.push(block("Redaction", "applied to " + ((MANIFEST.redaction.applied_to || []).join(", ") || "captures"),
      el("ul", {class:"clean"}, MANIFEST.redaction.rules.map(r => el("li", null, el("span", {class:"mono"}, r))))));
    g.appendChild(el("div", null, right));
    page.appendChild(g);
  } else {
    if (MANIFEST.limitations && MANIFEST.limitations.length) page.appendChild(block("Limitations", null, el("ul", {class:"clean"}, MANIFEST.limitations.map(l => el("li", null, l)))));
  }
  return page;
}
function renderStats(sites, ev, eps){
  const total = Object.keys(ev).reduce((a, k) => a + (ev[k] || 0), 0);
  const provs = [...new Set(sites.map(s => s.provider).filter(Boolean))];
  const kinds = [...new Set(sites.map(s => s.trigger && s.trigger.kind).filter(Boolean))];
  const cells = [
    ["call sites", sites.length],
    ["payloads", total],
    ["providers", provs.length],
    ["trigger kinds", kinds.length]
  ];
  const g = el("div", {class:"stats"});
  for (const [label, n] of cells){
    g.appendChild(el("div", {class:"stat"}, el("div", {class:"sv"}, String(n)), el("div", {class:"sl"}, label)));
  }
  return g;
}
function renderLadderHero(ev, rev){
  const max = Math.max(1, ...GRADE_ORDER.map(g => ev[g] || 0));
  const ladder = el("div", {class:"ladder"});
  for (const g of GRADE_ORDER){
    const n = ev[g] || 0;
    ladder.appendChild(el("div", {class:"rung " + (n ? "" : "zero") + " sw-" + g, title: GRADE_INFO[g].d},
      el("div", {class:"rn"}, el("span", {class:"rnl"}, g)),
      el("div", {class:"rt"}, el("div", {class:"rf", style:{width: pct(n, max) + "%"}})),
      el("div", {class:"rc"}, String(n))
    ));
  }
  const respLines = [];
  if (rev && Object.keys(rev).length){
    for (const g of GRADE_ORDER){
      if (!rev[g]) continue;
      respLines.push(el("div", {class:"rc-line"}, el("span", {class:"sw sw-" + g, style:{width:"7px",height:"7px",borderRadius:"50%",background:"var(--gc)"}}),
        el("span", null, g), el("span", {class:"n"}, String(rev[g]))));
    }
  }
  const card = el("div", {class:"resp-card"},
    el("div", {class:"rc-h"}, "responses"),
    respLines.length ? respLines : el("div", {class:"rc-line muted"}, "no response rollup recorded"),
    el("div", {class:"rc-note"}, "Request and response evidence are graded separately. A serialized request with an unresolved response is honest, not incomplete — the report says exactly which half it holds.")
  );
  return el("div", {class:"ladder-hero"},
    el("div", null,
      el("h2", null, "Evidence ladder"),
      el("p", {class:"lede", style:{marginBottom:"16px"}}, "Each payload is graded by how it was obtained — from a real artifact down to an honest gap."),
      ladder),
    card
  );
}

/* ---------------- keyboard ---------------- */
function bindKeys(){
  if (window.__llmMapKeys) return;
  window.__llmMapKeys = true;
  document.addEventListener("keydown", (e) => {
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") {
      if (e.key === "Escape") e.target.blur();
      return;
    }
    const sites = MANIFEST.call_sites || [];
    const i = sites.findIndex(s => s.id === state.selected);
    if (e.key === "j" || e.key === "ArrowDown"){
      e.preventDefault();
      const n = sites[Math.min(Math.max(i + 1, 0), sites.length - 1)];
      if (n) select(n.id, state.tab);
    } else if (e.key === "k" || e.key === "ArrowUp"){
      e.preventDefault();
      const n = sites[Math.max(i - 1, 0)];
      if (n) select(n.id, state.tab);
    } else if (/^[1-5]$/.test(e.key) && state.selected !== "__report__"){
      e.preventDefault(); setTab(TABS[Number(e.key) - 1][0]);
    } else if (e.key === "/"){
      e.preventDefault(); const s = $("#search"); if (s) s.focus();
    } else if (e.key.toLowerCase() === "t"){
      setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    } else if (e.key === "Escape"){
      document.body.classList.remove("rail-open");
    }
  });
}

boot();
